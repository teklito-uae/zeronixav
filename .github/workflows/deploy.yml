name: Build and Deploy to Production

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        env:
          VITE_API_URL: https://blanchedalmond-owl-957896.hostingersite.com
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, zip, pdo_mysql
          tools: composer:v2

      - name: Build Backend
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader
          rm -f bootstrap/cache/*.php

      - name: Prepare Deploy Folder
        run: |
          mkdir -p deploy/backend

          # 1. Copy Frontend Build
          cp -r frontend/dist/* deploy/

          # 2. Copy Backend Files (note: .env is intentionally NOT included here —
          # it never touches git; it's written directly to the server over SSH
          # in the "Configure .env and run Laravel commands" step below)
          cp -r backend/* deploy/backend/
          rm -f deploy/backend/.env

          # 3. Create Laravel storage/cache folders and preserve them
          mkdir -p deploy/backend/storage/app/public
          mkdir -p deploy/backend/storage/framework/cache
          mkdir -p deploy/backend/storage/framework/sessions
          mkdir -p deploy/backend/storage/framework/views
          mkdir -p deploy/backend/storage/logs
          mkdir -p deploy/backend/bootstrap/cache
          touch deploy/backend/storage/app/public/.gitkeep
          touch deploy/backend/storage/framework/cache/.gitkeep
          touch deploy/backend/storage/framework/sessions/.gitkeep
          touch deploy/backend/storage/framework/views/.gitkeep
          touch deploy/backend/storage/logs/.gitkeep
          touch deploy/backend/bootstrap/cache/.gitkeep
          chmod -R 775 deploy/backend/storage deploy/backend/bootstrap/cache

          # 4. Create root .htaccess for routing
          cat > deploy/.htaccess <<EOF
          <IfModule mod_rewrite.c>
            RewriteEngine On

            # Pass the Authorization header to the PHP backend
            RewriteCond %{HTTP:Authorization} .
            RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

            # Handle API requests
            RewriteRule ^api/(.*)$ backend/public/index.php [L]

            # Handle SPA routing - if file/dir doesn't exist, send to index.html
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

          # 5. Remove .gitignore files inside deploy to ensure everything is pushed
          find deploy -name ".gitignore" -type f -delete

      - name: Deploy to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: production
          clean: true
          single-commit: false

      - name: Trigger Hostinger Deployment
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.HOSTINGER_DEPLOY_HOOK }}"

      - name: Configure .env and run Laravel commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            BACKEND_PATH="$HOME/domains/blanchedalmond-owl-957896.hostingersite.com/public_html/backend"

            # Give Hostinger's webhook-triggered git pull time to land the new commit
            sleep 20
            for i in $(seq 1 24); do
              if [ -f "$BACKEND_PATH/artisan" ]; then break; fi
              sleep 5
            done

            cat > "$BACKEND_PATH/.env" <<'ENVEOF'
            ${{ secrets.PRODUCTION_ENV }}
            ENVEOF

            cd "$BACKEND_PATH"
            chmod -R 775 storage bootstrap/cache
            php artisan config:clear
            php artisan migrate --force

            # Only run the full demo/admin seeder once — its non-admin/brand rows
            # aren't idempotent, so re-seeding on every push would duplicate data.
            PRODUCT_COUNT=$(php artisan tinker --execute="echo \App\Models\Product::count();" 2>/dev/null | tail -1)
            if [ "$PRODUCT_COUNT" = "0" ]; then
              php artisan db:seed --force
            fi

            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            # view:cache is skipped: it force-compiles every Blade view, including
            # the unused app/Filament/* pages left over from Filament never being
            # installed (see backend/app/Filament); those reference components
            # that don't exist without the package, so caching them fails. Since
            # nothing routes to those views, they're harmless left uncompiled.
